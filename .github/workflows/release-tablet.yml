name: Publish Panik Attak Tablet

on:
  push:
    tags:
      - v3.0-alpha.8-tablet

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tablet APK checksum, identity and signature
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c Panik-Attak-Tab-S11-Ultra.apk.sha256
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging Panik-Attak-Tab-S11-Ultra.apk | grep -F "package: name='it.panikattak.app.tablet' versionCode='16' versionName='3.0-alpha.8-tablet'"
          "$tools/apksigner" verify --print-certs Panik-Attak-Tab-S11-Ultra.apk | grep -F 'Signer #1 certificate SHA-256 digest: 12b4d56e7d15448031ffda1c109af7763503f6d9b297ad1eb7686c82bc3340e0'
          if "$tools/aapt" dump badging Panik-Attak-Tab-S11-Ultra.apk | grep -q '^application-debuggable'; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
      - name: Publish tablet prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          Panik-Attak-Tab-S11-Ultra.apk Panik-Attak-Tab-S11-Ultra.apk.sha256
          --repo "$GITHUB_REPOSITORY"
          --verify-tag --prerelease
          --title "Panik Attak 3.0 Alpha 8 · Galaxy Tab S11 Ultra"
          --notes-file RELEASE-NOTES-alpha8-tablet.md

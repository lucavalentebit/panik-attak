plugins { id 'com.android.application' }
android {
    namespace 'it.panikattak.app'
    compileSdk 35
    defaultConfig { applicationId 'it.panikattak.app'; minSdk 26; targetSdk 35; versionCode 10; versionName '3.0-alpha.4'; testInstrumentationRunner project.findProperty('testRunner') ?: 'it.panikattak.app.AlarmSmoke' }

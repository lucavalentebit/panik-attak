plugins { id 'com.android.application' }
android {
    namespace 'it.panikattak.app'
    compileSdk 35
    androidResources { noCompress 'tflite' }
    defaultConfig { applicationId 'it.panikattak.app'; minSdk 26; targetSdk 35; versionCode 14; versionName '3.0-alpha.6.2'; testInstrumentationRunner project.findProperty('testRunner') ?: 'it.panikattak.app.AlarmSmoke' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
